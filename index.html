<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hat Hackers-v5 | Nahid Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   <link rel="icon" type="image/x-icon" href="https://uploads.onecompiler.io/44m2zj4qk/44n89ftt3/13479.gif">
    <meta name="google-site-verification" content="neQSYgymCpFhHUEYK524dwwKHzgNJ4FKB-dZ6CtHv1c" />
<style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body {
            background: linear-gradient(rgba(0,0,0,0.95), rgba(0,0,0,0.95)), url('https://uploads.onecompiler.io/44ncz8e5z/44nd5m7sn/13573.gif');
            background-size: cover;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
        }
        .terminal-box { background: rgba(0, 5, 0, 0.98); border: 1px solid #00ff41; padding: 8px; font-size: 10px; overflow: hidden; height: 100%; }
        .status-bar { background: #00ff41; color: black; font-weight: bold; padding: 2px 8px; font-size: 10px; margin-bottom: 5px; text-transform: uppercase;}
        #main-dashboard, #hacking-screen, #result-screen { display: none; }
        #main-dashboard { display: block; }
        .btn-custom { border: 1px solid #00ff41; color: #00ff41; padding: 12px; background: transparent; font-weight: bold; width: 100%; border-radius: 8px; text-transform: uppercase; transition: 0.4s; cursor: pointer; }
        .btn-custom:hover { background: #00ff41; color: black; box-shadow: 0 0 25px #00ff41; }
        .btn-secondary { border: 1px solid #555; color: #ccc; padding: 10px; background: transparent; width: 100%; border-radius: 8px; margin-top: 10px; transition: 0.3s; cursor: pointer; }
        .btn-secondary:hover { border-color: #00ff41; color: #00ff41; }
        .profile-frame { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #00ff41; padding: 5px; box-shadow: 0 0 30px rgba(0, 255, 65, 0.6); }
    </style>
</head>
<body>

    <div class="flex justify-between items-center p-4 border-b border-green-900 bg-black">
        <h1 class="text-md font-bold tracking-widest"><i class="fa-solid fa-terminal animate-pulse"></i> BLACK HAT HACKERS-V5</h1>
        <div id="clock" class="text-xs text-green-500"></div>
    </div>

    <div id="main-dashboard" class="p-6 flex flex-col items-center justify-center h-[85vh]">
        <div class="max-w-md w-full bg-black/80 p-10 border border-green-500 rounded-[40px] shadow-[0_0_50px_rgba(0,255,65,0.1)] text-center">
            <img src="https://uploads.onecompiler.io/44ncz8e5z/44ncz9j28/13571.gif" class="w-24 mx-auto mb-6">
            <h1 class="text-xl mb-6 font-black tracking-tighter">SUBMIT TARGET FB URL</h1>
            <input type="text" id="target-link" placeholder="Enter Facebook Profile URL" 
                   class="w-full bg-transparent border-b-2 border-green-800 p-3 mb-10 text-green-400 text-center outline-none focus:border-green-400 transition-all">
            <button onclick="startInfiltration()" class="btn-custom">TARGET ACCESS RUN</button>
        </div>
       <img src="https://uploads.onecompiler.io/44ncz8e5z/44nd5m7sn/13573.gif" width="100%" height="100%">
    </div>
   </div>

    <div id="hacking-screen" class="grid grid-cols-2 md:grid-cols-4 gap-2 p-2 h-[90vh]"></div>

    <div id="result-screen" class="flex flex-col items-center justify-center h-[85vh] p-5">
        <div class="w-full max-w-sm bg-black border-2 border-green-500 p-8 rounded-3xl text-center shadow-2xl relative">
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-green-500 text-black px-4 py-1 text-[10px] font-bold rounded">DATABASE MATCH</div>
            <img src="https://uploads.onecompiler.io/44ncz8e5z/44ncz9j28/13571.gif" id="res-img" class="profile-frame mx-auto mb-4 object-cover">
            <h3 id="res-name" class="text-2xl font-bold text-white mb-1 uppercase tracking-tight">TARGET USER</h3>
            <p class="text-[10px] text-gray-500 mb-6 italic">Status: Security Protocols Bypassed</p>
            <div class="bg-green-900/10 p-5 rounded-xl border border-green-900 text-left mb-8">
                <p class="text-[9px] text-green-600 uppercase mb-1">Encrypted Password</p>
                <div class="flex items-center justify-between">
                    <p class="text-2xl tracking-[0.5em] text-white font-black">********</p>
                    <i class="fa-solid fa-lock text-green-500 animate-pulse"></i>
                </div>
            </div>
            <button onclick="showPayment()" class="btn-custom"><i class="fa-solid fa-eye"></i> VIEW PASSWORD</button>
            <button onclick="location.reload()" class="btn-secondary">BACK HOME</button>
        </div>
    </div>
    
    <script>
        setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

        const titles = ["PROXY_LINK", "SSL_STRIP", "PACKET_VAL", "VULN_SCAN", "HEX_EXTRACT", "MFA_BYPASS", "TOKEN_GEN", "NODE_JS_INJ", "ROOT_FINDER", "SQL_QUERY", "KEY_LOG_ACT", "SYNC_COMPLETE"];

        function startInfiltration() {
            let urlInput = document.getElementById('target-link').value.trim();
            if(!urlInput.includes("facebook.com")) {
                return Swal.fire({ icon: 'error', title: 'Invalid Link', text: 'Please provide a valid Facebook URL!', background: '#000', color: '#0f0', confirmButtonColor: '#00ff41'});
            }

            // --- নতুন নাম শনাক্তকরণ লজিক (নিখুঁত করার চেষ্টা) ---
            let extractedName = "TARGET ACCOUNT";
            try {
                let tempUrl = urlInput;
                if (!tempUrl.startsWith('http')) tempUrl = 'https://' + tempUrl;
                let urlObj = new URL(tempUrl);
                
                // ১. যদি profile.php?id=... ফরম্যাট হয়
                if (urlObj.pathname.includes("profile.php")) {
                    extractedName = urlObj.searchParams.get("id") || "USER_" + Math.floor(Math.random() * 9999);
                } else {
                    // ২. সাধারণ ইউজারনেম ফরম্যাট (facebook.com/username)
                    let pathParts = urlObj.pathname.split('/').filter(part => part.length > 0);
                    if (pathParts.length > 0) {
                        // অপ্রয়োজনীয় স্ল্যাশ বা সাব-ডিরেক্টরি বাদ দেওয়া
                        let rawName = pathParts[0]; 
                        // ডট (.) থাকলে স্পেস দিয়ে পরিবর্তন এবং বড় হাতের অক্ষর
                        extractedName = rawName.replace(/\./g, ' ').replace(/-/g, ' ').toUpperCase();
                    }
                }
            } catch(e) { extractedName = "ACCESS_DENIED"; }

            document.getElementById('res-name').textContent = extractedName;
            document.getElementById('main-dashboard').style.display = 'none';
            const hackScreen = document.getElementById('hacking-screen');
            hackScreen.style.display = 'grid';
            hackScreen.innerHTML = "";

            for(let i=0; i<12; i++) {
                const box = document.createElement('div');
                box.className = "terminal-box";
                box.innerHTML = `<div class="status-bar">${titles[i]}</div><div id="log-${i}" class="opacity-60"></div>`;
                hackScreen.appendChild(box);
                runAdvancedLogs(i);
            }
            setTimeout(showResult, 20000); 
        }

        function runAdvancedLogs(id) {
            const log = document.getElementById(`log-${id}`);
            const codes = ["Connecting...", "Bypassing SSL...", "Tunneling Node", "Fetching Data", "Exploit_v5 Active", "DB_Query: OK", "Cracking Hash...", "KeyFound: 0x7", "Syncing...", "Nahid_Pro Access"];
            setInterval(() => {
                const div = document.createElement('div');
                div.className = "mb-1 border-l border-green-800 pl-1";
                div.textContent = `> ${codes[Math.floor(Math.random() * codes.length)]} [${(Math.random() * 100).toFixed(1)}%]`;
                log.prepend(div);
                if(log.children.length > 15) log.lastChild.remove();
            }, 350);
        }

        function showResult() {
            document.getElementById('hacking-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
        }

        function showPayment() {
            Swal.fire({
                title: 'ACCESS RESTRICTED',
                html: `
                    <div class="text-left text-sm text-green-400">
                        <p class="mb-4">Verification Payment of <b>2.00 USDT</b> is required to unlock the full password.</p>
                        <div class="bg-green-900/20 p-4 rounded-lg border border-green-500 mb-4">
                            <p class="text-[10px] text-gray-400 uppercase">TRX (TRC20) Address:</p>
                            <p class="text-[12px] text-white break-all font-mono mt-1 font-bold tracking-tight">TKLV5Z6Rt4eAhYw4LrqqE3enmfErxKUkjD</p>
                        </div>
                        <p class="text-[10px] text-center text-red-500 animate-pulse uppercase font-bold">Send payment to view decrypted keys</p>
                    </div>
                `,
                showConfirmButton: true,
                confirmButtonText: 'I HAVE SENT PAYMENT',
                confirmButtonColor: '#00ff41',
                background: '#000',
                color: '#fff'
            });
        }
    </script>
</body>
</html>
